group 'com.vocsy.epub_viewer'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// r2-shared-kotlin / r2-streamer-kotlin are not published anywhere except JitPack, so they are
// vendored as a file-based Maven repo next to this script (see the POM comments for details).
// Dependencies of this module are resolved by the app project too, hence rootProject.allprojects.
def vendoredMavenRepo = file('maven')

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url vendoredMavenRepo }
    }
}

// Kotlin is deliberately not applied here: Flutter applies the Kotlin Gradle plugin to plugins
// itself on AGP 8, and AGP 9 compiles Kotlin with its built-in support. Applying it explicitly
// is reported by Flutter as an upcoming build failure.
apply plugin: 'com.android.library'

android {
    // The embedded FolioReader sources reference com.folioreader.R and com.folioreader.BuildConfig,
    // so the module namespace is com.folioreader. The plugin class keeps its own Java package.
    namespace 'com.folioreader'
    compileSdk = flutter.compileSdkVersion

    defaultConfig {
        minSdkVersion 24
        // Keep rules for reflection used by the reader, r2-streamer and their dependencies.
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        // FileUtil imports com.folioreader.BuildConfig; AGP 8 no longer generates it by default.
        buildConfig true
    }

    lint {
        disable.add('InvalidPackage')
    }
}

// Configured on the compile task instead of kotlin { compilerOptions } so it works with both
// Kotlin 1.8+ and 2.x, whichever Kotlin Gradle plugin the host app brings.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

def jackson_version = '2.14.3'
def retrofit_version = '2.5.0'

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Used from row_bookmark.xml / row_highlight.xml. @aar skips its legacy support-library deps.
    implementation 'com.daimajia.swipelayout:library:1.2.0@aar'
    implementation 'org.greenrobot:eventbus:3.1.1'

    implementation "com.fasterxml.jackson.core:jackson-core:$jackson_version"
    implementation "com.fasterxml.jackson.core:jackson-annotations:$jackson_version"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jackson_version"

    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-jackson:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    // FolioWebView uses org.springframework.util.ReflectionUtils.
    implementation 'org.springframework:spring-core:4.3.19.RELEASE'

    // nanohttpd 2.3.1 backs the org.nanohttpd.* shim classes that r2-streamer was compiled against.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-nanolets:2.3.1'

    // Vendored copies of com.github.codetoart:r2-*-kotlin, see maven/. They use their own groupId so
    // that a jitpack.io repository added by other plugins can't serve the original POMs instead.
    implementation 'com.vocsy.epub_viewer.vendored:r2-shared-kotlin:1.0.4-2'
    implementation 'com.vocsy.epub_viewer.vendored:r2-streamer-kotlin:1.0.4-2'

    testImplementation 'junit:junit:4.13.2'
}
